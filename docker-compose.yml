services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: privacypilot
      POSTGRES_USER: privacypilot
      POSTGRES_PASSWORD: privacypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacypilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/privacypilot
      DB_USERNAME: privacypilot
      DB_PASSWORD: privacypilot
      # LLM stays in offline deterministic fallback unless a key is supplied.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-flash}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser talks to the backend on the host-published port.
        VITE_API_BASE: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
