spring:
  application:
    name: privacypilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/privacypilot}
    username: ${DB_USERNAME:privacypilot}
    password: ${DB_PASSWORD:privacypilot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

privacypilot:
  security:
    # Static bearer tokens for the demo's two principals. Blank tokens disable the
    # corresponding role's access. In production these would come from a secret
    # store, and the operator token would be replaced by real user auth.
    operator-token: ${OPERATOR_API_TOKEN:}
    webhook-token: ${WEBHOOK_API_TOKEN:}
  cors:
    # Comma-separated exact origins allowed to call the API (no wildcard).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # LLM configuration. When apiKey is blank, the app runs in a deterministic
  # offline fallback mode so it never crashes and remains demoable without keys.
  llm:
    provider: ${LLM_PROVIDER:gemini}        # gemini | openai
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gemini-1.5-flash}
    base-url: ${LLM_BASE_URL:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  classifier:
    # Below this confidence, a reply is routed to human review instead of being
    # forced into one of the six categories. This is the precision/recall knob.
    confidence-threshold: ${CLASSIFIER_CONFIDENCE_THRESHOLD:0.6}
  followup:
    # How long to wait for a reply before a request becomes eligible for follow-up.
    wait-window-hours: ${FOLLOWUP_WAIT_WINDOW_HOURS:168}   # 7 days
    # Cron for the scheduler that scans for due follow-ups.
    scan-cron: ${FOLLOWUP_SCAN_CRON:0 0 * * * *}           # hourly
    sender-email: ${FOLLOWUP_SENDER_EMAIL:privacy@privacypilot.example}
  outbox:
    # How often the delivery worker polls for claimable rows.
    poll-ms: ${OUTBOX_POLL_MS:5000}
    # Delivery lease. A PROCESSING row whose claim is older than this is assumed
    # to belong to a crashed worker and becomes eligible for re-claim.
    lease-seconds: ${OUTBOX_LEASE_SECONDS:120}

logging:
  level:
    com.privacypilot: INFO
